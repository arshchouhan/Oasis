{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ClearEye{% endblock %}</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
    <div class="app-layout">
        {% include 'partials/sidebar.html' %}

        <div class="center-column">
            {% include 'partials/navbar.html' %}

            <div class="content-area">
                <main class="main-content">
                    {% block content %}{% endblock %}
                </main>

                <aside class="side-panel" id="sidePanel">
                    <div class="side-panel-header">
                        <div class="side-panel-title">
                            <span class="material-symbols-outlined" id="sidePanelIcon">event</span>
                            <h3 id="sidePanelTitleText">Calendar</h3>
                        </div>
                        <button class="icon-btn" id="closePanelBtn" title="Close">
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </div>
                    <div class="side-panel-body" id="sidePanelBody">
                        <p class="panel-placeholder">Select an item from the rail.</p>
                    </div>
                </aside>
            </div>
        </div>

        <div class="right-rail">
            <button class="rail-btn" data-panel="reminders" data-icon="alarm" data-title="Reminders" title="Reminders">
                <span class="material-symbols-outlined">alarm</span>
            </button>
            <button class="rail-btn" data-panel="notes" data-icon="edit_note" data-title="Notes" title="Notes">
                <span class="material-symbols-outlined">edit_note</span>
            </button>
            <button class="rail-btn" data-panel="tasks" data-icon="task_alt" data-title="Tasks" title="Tasks">
                <span class="material-symbols-outlined">task_alt</span>
            </button>
            <button class="rail-btn" data-panel="analytics" data-icon="monitoring" data-title="Analytics" title="Analytics">
                <span class="material-symbols-outlined">monitoring</span>
            </button>
            <div class="rail-divider"></div>
            <button class="rail-btn" data-panel="contacts" data-icon="person" data-title="Contacts" title="Contacts">
                <span class="material-symbols-outlined">person</span>
            </button>
        </div>
    </div>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
