{% extends "doctor_portal/base.html" %}

{% block title %}Community | Doctor Portal{% endblock %}

{% block content %}
<section style="min-height: calc(100vh - 96px); display: grid; place-items: center; padding: 32px; box-sizing: border-box;">
    <div style="width: min(100%, 620px); padding: 32px; border: 1px solid #dbe5f1; border-radius: 20px; background: var(--md-sys-color-surface, #fff); box-shadow: 0 8px 28px rgba(27,73,101,.08);">
        <span class="material-symbols-outlined" style="color: #087f8c; font-size: 32px;">groups</span>
        <h1 style="margin: 14px 0 8px; color: #0b315a; font-size: 26px;">Community</h1>
        <p style="margin: 0; color: #5f6f82; line-height: 1.5;">The doctor community workspace will appear here.</p>
    </div>
</section>
{% endblock %}
