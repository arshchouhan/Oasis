<section class="panel-workspace"><button class="panel-back" type="button"><span class="material-symbols-outlined">arrow_back</span>Patient details</button><h3>Consultation</h3><p>Record your consultation with {{ patient.get_full_name|default:patient.username }}. Saved details appear in their consultation history.</p><div class="panel-result" role="status" hidden></div><form class="panel-form" data-workspace-form="consultation">{% csrf_token %}{% for field in form %}<label style="grid-column:1/-1">{{ field.label }}{% if not field.field.required %} (optional){% endif %}{{ field }}</label>{% endfor %}<button type="submit">Save consultation</button></form></section>
