<section class="panel-workspace"><button class="panel-back" type="button"><span class="material-symbols-outlined">arrow_back</span>Patient details</button><h3>Schedule Google Meet</h3><p>Create a consultation and send an invitation to {{ patient.get_full_name|default:patient.username }}.</p><form class="panel-form" data-workspace-form="meet"><label>Meeting title<input name="title" required value="Consultation with {{ patient.get_full_name|default:patient.username }}"></label><label>Start<input name="start" type="datetime-local" required></label><label>End<input name="end" type="datetime-local" required></label><label>Notes <small>(optional)</small><textarea name="description" placeholder="Consultation notes"></textarea></label><button type="submit">Schedule Meet</button></form><div class="panel-result" hidden></div></section>
