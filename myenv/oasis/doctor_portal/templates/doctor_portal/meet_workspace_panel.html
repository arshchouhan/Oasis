</div><nav class="meet-workspace-tabs" role="tablist" aria-label="Meeting workspace"><button type="button" role="tab" aria-selected="{% if show_requests %}false{% else %}true{% endif %}" data-meet-tab="schedule">Schedule meeting</button><button type="button" role="tab" aria-selected="false" data-meet-tab="scheduled">Scheduled meetings</button><button type="button" role="tab" aria-selected="{% if show_requests %}true{% else %}false{% endif %}" data-meet-tab="requests">Patient requests</button></nav><div data-meet-panel="requests" role="tabpanel"{% if not show_requests %} hidden{% endif %}>{% include "doctor_portal/patient_consultation_requests.html" %}</div><div data-meet-panel="schedule" role="tabpanel"{% if show_requests %} hidden{% endif %}><p>Create a consultation and send an invitation to {{ patient.get_full_name|default:patient.username }}.</p><form class="panel-form" data-workspace-form="meet"><label>Meeting title<input name="title" required value="Consultation with {{ patient.get_full_name|default:patient.username }}"></label><label>Start<input name="start" type="datetime-local" required></label><label>End<input name="end" type="datetime-local" required></label><label>Notes <small>(optional)</small><textarea name="description" placeholder="Consultation notes"></textarea></label><button type="submit">Schedule Meet</button></form><div class="panel-result" hidden></div></div><div data-meet-panel="scheduled" role="tabpanel" hidden>{% include "doctor_portal/patient_meetings.html" %}</div></section>
