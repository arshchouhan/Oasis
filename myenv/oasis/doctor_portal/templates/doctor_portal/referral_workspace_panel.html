<section class="panel-workspace"><button class="panel-back" type="button"><span class="material-symbols-outlined">arrow_back</span>Patient details</button><h3>Refer patient</h3><p>Start a doctor-to-doctor referral for {{ patient.get_full_name|default:patient.username }}.</p><form class="panel-form" data-workspace-form="referral"><label>Refer to *<select name="doctor_id" required><option value="">Select a doctor</option>{% for doctor in doctors %}<option value="{{ doctor.id }}">Dr. {{ doctor.get_full_name|default:doctor.username }} · {{ doctor.doctor_profile.specialty|default:'Doctor' }}</option>{% endfor %}</select></label><label>Referral type<select name="referral_type"><option>Specialist consultation</option><option>Second opinion</option><option>Co-managed care</option></select></label><fieldset><legend>Priority</legend><label><input type="radio" name="priority" value="routine" checked> Routine</label><label><input type="radio" name="priority" value="urgent"> Urgent</label><label><input type="radio" name="priority" value="emergency"> Emergency</label></fieldset><label>Preferred date <small>(optional)</small><input type="date" name="preferred_date"></label><label>Reason for referral *<textarea name="note" required placeholder="Add relevant referral context for the receiving doctor"></textarea></label><button type="submit">Start referral</button></form><div class="panel-result" hidden></div></section>
